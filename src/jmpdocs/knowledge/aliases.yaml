# JMP vocabulary bridge.
#
# JMP names many standard techniques its own way. Measured on the real corpus:
# the phrase "random forest" appears ZERO times on bootstrap-forest.shtml, and
# "gradient boosting" ZERO times on boosted-tree.shtml. Without this file a user
# asking "how do I run a random forest in JMP?" retrieves nothing useful --
# BM25 has no lexical overlap and embeddings are unreliable on product proper
# nouns.
#
# Each entry maps the words a *user* types to the words *JMP* uses.
#   jmp:  JMP's own terminology (platform / menu / feature names)
#   user: what someone would actually type
#
# Used at both ends on purpose:
#   index time - user terms are appended to the BM25 text of chunks that
#                mention the JMP term, so lexical search can find them
#   query time - matched JMP terms are injected into the expanded queries
#
# Every entry is checked by tests/test_aliases.py: querying the user terms must
# surface a chunk containing one of the JMP terms.

version: 1

