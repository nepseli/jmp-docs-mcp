# Retrieval evaluation set.
#
# Written deliberately in USER vocabulary, not documentation vocabulary. A set
# phrased the way the docs phrase things would score near-perfect and tell us
# nothing -- the whole risk in this project is the gap between the two.
#
# expect_title_any : at least one retrieved chunk's page title must contain one
#                    of these (case-insensitive substring).
# expect_intent    : the intent classifier should produce this.
#
# Scored by tests/test_retrieval.py as recall@k and MRR.

questions:
  # ---- the vocabulary bridge: JMP's name differs from the user's word ----
  - id: vb-random-forest
    q: How do I run a random forest in JMP?
    category: vocabulary_bridge
    expect_title_any: [Bootstrap Forest]
    expect_intent: how_to

  - id: vb-gradient-boosting
    q: Does JMP support gradient boosting or XGBoost?
    category: vocabulary_bridge
    expect_title_any: [Boosted Tree]

  - id: vb-decision-tree
    q: I want to build a decision tree classifier
    category: vocabulary_bridge
    expect_title_any: [Partition]

  - id: vb-pivot-table
    q: How do I make a pivot table?
    category: vocabulary_bridge
    expect_title_any: [Tabulate]
    expect_intent: how_to

  - id: vb-vlookup
    q: What is the JMP equivalent of VLOOKUP?
    category: vocabulary_bridge
    expect_title_any: [Join, Virtual]

  - id: vb-cpk
    q: How do I check if my process is capable and get Cpk?
    category: vocabulary_bridge
    expect_title_any: [Process Capability, Capability]

  - id: vb-gage-rr
    q: How do I do a Gage R&R study?
    category: vocabulary_bridge
    expect_title_any: [Variability Chart, Measurement Systems]

  - id: vb-weibull
    q: How do I fit a Weibull distribution to failure times?
    category: vocabulary_bridge
    expect_title_any: [Life Distribution, Weibull]

  - id: vb-pca
    q: How do I do PCA for dimension reduction?
    category: vocabulary_bridge
    expect_title_any: [Principal Components]

  - id: vb-kmeans
    q: How do I run k-means clustering?
    category: vocabulary_bridge
    expect_title_any: [K Means Cluster, Cluster]

  - id: vb-anova
    q: How do I run a one-way ANOVA to compare group means?
    category: vocabulary_bridge
    expect_title_any: [Oneway, Fit Y by X, Analysis of Variance]

  - id: vb-logistic
    q: How do I fit a logistic regression?
    category: vocabulary_bridge
    expect_title_any: [Logistic, Fit Model]

  - id: vb-unpivot
    q: How do I unpivot columns from wide to long format?
    category: vocabulary_bridge
    expect_title_any: [Stack]

  # Kept deliberately, and expected to fail. JMP has no deduplication feature:
  # the documented approach is Tables > Summary grouped by every column. There
  # is no page that answers this directly, so the correct system behaviour is to
  # return near-misses and have the model say the docs do not cover it. Deleting
  # the question would hide a real gap rather than record it.
  - id: vb-dedupe
    q: How do I remove duplicate rows?
    category: vocabulary_bridge
    known_gap: true
    expect_title_any: [Distinct, Summary, Duplicate]

  - id: vb-heatmap
    q: How do I make a heat map?
    category: vocabulary_bridge
    expect_title_any: [Graph Builder, Cell Plot, Heat]

  # ---- intent routing: same topic, different kind of answer wanted ----
